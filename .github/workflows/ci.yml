name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: build site

    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: install dependencies
        run: bun ci

      - name: build site
        run: bun run build
