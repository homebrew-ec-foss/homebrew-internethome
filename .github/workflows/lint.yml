name: lint

on:
  push:
    branches:
      - main
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "package.json"
      - "eslint.config.js"
      - ".github/workflows/lint.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "package.json"
      - "eslint.config.js"
      - ".github/workflows/lint.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    name: lint and format check

    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: install dependencies
        run: bun ci

      - name: run eslint
        run: bun run lint

      - name: run prettier check
        run: bun run format:check
